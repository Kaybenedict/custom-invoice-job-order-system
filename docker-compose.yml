services:
  db:
    image: postgres:15
    container_name: odoo-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: odoo:17.0
    container_name: odoo-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1000:8069"                # access Odoo at http://<server-ip>:1000
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - TZ=Africa/Lagos
    volumes:
      - odoo-web-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons

volumes:
  odoo-web-data:
  odoo-db-data:
